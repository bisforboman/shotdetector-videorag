name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      # FFmpeg 8.1's shared build: its ffmpeg makes the test clip, its libraries let the tests check the stills.
      - id: ffmpeg
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared
      - name: FFmpeg's libraries
        run: echo "SHOTDETECTOR_FFMPEG_LIBS=${{ steps.ffmpeg.outputs.bin }}" >> "$GITHUB_ENV"
      # Stanza's English tokenizer (about 1.2 MB, the sentence chunker's tests) and default_fast ner (about 135 MB with
      # its word vectors, the entity tests) in one folder, downloaded by StanzaSharp's tool, which checks each file's
      # MD5 and fetches only what is missing. The tool's version is StanzaSharp.DataIngestion's (Directory.Packages.props).
      - id: stanza
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/stanza/en
          key: stanza-en-tokenize-default_fast-ner-1.15.0
      - name: Stanza's tokenizer and ner
        if: steps.stanza.outputs.cache-hit != 'true'
        run: |
          dotnet tool install --tool-path .tools StanzaSharp.Tool --version 1.15.0
          .tools/stanzasharp download models/stanza/en --processors tokenize
          .tools/stanzasharp download models/stanza/en --package default_fast --processors tokenize,ner
      - name: Stanza's models
        run: echo "STANZASHARP_MODELS=$GITHUB_WORKSPACE/models/stanza/en" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build ShotDetector.VideoRag.slnx -c Release
      - name: Test
        run: dotnet test ShotDetector.VideoRag.slnx -c Release --no-build --logger GitHubActions
